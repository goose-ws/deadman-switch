# =============================================================================
# payload.conf — Deadman Switch Payload Configuration
# =============================================================================
# Copy this file to payload.conf alongside payload.sh and fill in your values.
#
# ⚠️  SECURITY: This file contains credentials in plaintext. Lock it down
#     immediately after filling in your values:
#       chmod 600 /var/lib/deadman/payload.conf
#       chown deadman:deadman /var/lib/deadman/payload.conf
# =============================================================================


# SMTP (Outbound Email)
# Used to send queued message files from the messages/ directory.
# Also used during the monthly test to send a canary email.
#
# smtpUrl      — Full SMTP URL including scheme and port.
#                Implicit TLS (port 465): smtps://smtp.yourprovider.com:465
#                STARTTLS   (port 587):   smtp://smtp.yourprovider.com:587
# smtpUser     — SMTP login username (usually your full email address).
# smtpPassword — SMTP password or app-specific password.

smtpUrl="smtps://smtp.yourprovider.com:465"
smtpUser="you@yourprovider.com"
smtpPassword="YourSmtpPasswordOrAppPassword"


# FastMail JMAP (Canary Receipt Verification)
# Used during the monthly test to confirm the canary email was delivered
# and to delete it afterwards, keeping your inbox clean.
#
# To generate a token:
#   FastMail → Settings → Privacy & Security → Integrations → API Tokens
#   Grant: Mailboxes (read) and Email (read + write).
#
# fastmailToken   — Your FastMail API token.
# fastmailAddress — Your FastMail address. Optional: the script auto-discovers
#                   this from the JMAP session. Set here only as a fallback.

fastmailToken="fmu1-YOUR-FASTMAIL-TOKEN-HERE"
fastmailAddress=""


# Email Queue Directories
# msgDir     — Directory containing .txt message files to send when the
#              payload fires. Files are NOT deleted after sending.
# msgDirTest — Temporary directory used during the monthly test for the
#              canary email. Cleaned up automatically after each test run.

msgDir="/var/lib/deadman/messages"
msgDirTest="/var/lib/deadman/messages-test"


# Add your own configuration variables below.
# Anything defined here is available throughout payload.sh.
